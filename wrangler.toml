# Cloudflare PAGES configuration for n9n (omniflow hub).
#
# IMPORTANT — this is a Pages project, NOT a Workers project.
#   * `pages_build_output_dir` is required, otherwise Cloudflare says
#     "A Wrangler configuration file was found but it does not appear to be valid".
#   * There must be NO `[assets]` block: the name `ASSETS` is reserved in Pages
#     and makes the deploy fail with
#     "The name 'ASSETS' is reserved in Pages projects".
#   * `[[routes]]` (custom domains) and `[triggers]` (cron) are Workers-only.
#     Custom domains are attached in the Pages dashboard, and the cron tick is
#     driven by an external scheduler hitting /api/public/hooks/tick.
#
# Cloudflare Pages build settings:
#   Build command:        npm run build
#   Build output dir:     dist
#
# Secrets (Pages dashboard → Settings → Variables and Secrets, Production+Preview):
#   APP_SUPABASE_SERVICE_ROLE_KEY
#   CREDENTIAL_ENCRYPTION_KEY
#   LOVABLE_API_KEY
#   AI_WORKFLOW_MODEL_API_KEY

name = "n9n"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]

[vars]
